<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Face Detection with Google Vision API</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <h1>Face Detection</h1>
    <input type="file" id="imageUpload" />
    <button id="detectFace">Detect Face</button>
    <pre id="result"></pre>

    <script>
        $(document).ready(function() {
            $('#detectFace').click(function() {
                const file = $('#imageUpload')[0].files[0];
                const reader = new FileReader();
                
                reader.onload = function(event) {
                    const base64Image = event.target.result.split(',')[1];
                    sendImageToGoogleVision(base64Image);
                };

                if (file) {
                    reader.readAsDataURL(file);
                } else {
                    alert('이미지를 선택해주세요.');
                }
            });
        });

        function sendImageToGoogleVision(base64Image) {
            const apiKey = 'AIzaSyDi94VcNGi0X5P3DmGYGIJw549Fi5zy8D0'; // 여기에 자신의 API 키를 입력하세요.
            const url = `https://vision.googleapis.com/v1/images:annotate?key=${apiKey}`;
            const requestPayload = {
                "requests": [
                    {
                        "image": {
                            "content": base64Image
                        },
                        "features": [
                            {
                                "type": "FACE_DETECTION",
                                "maxResults": 10
                            }
                        ]
                    }
                ]
            };

            $.ajax({
                url: url,
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(requestPayload),
                success: function(response) {
                    $('#result').text(JSON.stringify(response, null, 2));
                },
                error: function(err) {
                    console.error(err);
                    alert('오류가 발생했습니다.');
                }
            });
        }
    </script>
</body>
</html>
